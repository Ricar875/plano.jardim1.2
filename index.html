<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlanoJardim — Professor</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--tx:#1f2a44;--mu:#5d6b8a;--pr:#2f6bff;--ac:#ff9f1c;--bd:#dce6f7;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--card:#18224a;--tx:#eef3ff;--mu:#a3b1d6;--bd:#2a3868;--pr:#6c9bff;--on:#0f1730;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1730;--card:#18224a;--tx:#eef3ff;--mu:#a3b1d6;--bd:#2a3868;--pr:#6c9bff;--on:#0f1730;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 16px 18px;background:linear-gradient(135deg,#2f6bff,#6c47ff 62%,#ff5d8f);color:#fff;border-radius:0 0 26px 26px;margin-bottom:6px}h1{margin:0;font-size:26px}h1 span{color:#ffd166}
.sub{color:var(--mu);font-size:13px;margin:2px 0 0}header .sub{color:#e6ecff;font-size:14px}
nav{display:flex;gap:6px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
nav button,.chip,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button.on,.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}.btn.pr{background:var(--ac);color:#2a1a00;border-color:var(--ac);font-weight:700}
main{padding:8px 16px 40px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.item b{display:block;font-size:15px}.item small{color:var(--mu)}.item .i{font-size:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{display:inline-block;font-size:11px;background:var(--bd);border-radius:6px;padding:1px 6px;color:var(--mu)}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto}
td,th{border:1px solid #999;padding:6px;vertical-align:top;text-align:left}
/* folha de papel */
.sheet{background:#fff;color:#000;border-radius:8px;padding:18px;max-width:794px;margin:10px auto;border:1px solid #ccc;overflow-x:auto}
.sheet h2{margin:0;font-size:22px;text-align:center;color:#2f6bff}.sheet .ins{text-align:center;margin:4px 0 12px;font-size:15px}
.sheet .hd{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:2px dashed #888;padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap}
.sheet .row{display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px;margin:12px 0;flex-wrap:wrap;border:2px solid #ddd;border-radius:14px;padding:8px}
.sheet .row b{font-size:34px}
.box{display:inline-block;width:54px;height:54px;border:3px solid #000;border-radius:10px;vertical-align:middle}
.opt{display:inline-flex;width:46px;height:46px;border:3px solid #000;border-radius:50%;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:14px 90px;max-width:420px;margin:auto}
.mt div{display:flex;align-items:center;gap:8px;font-size:34px;justify-content:center;border:2px solid #ddd;border-radius:12px;padding:6px;min-height:64px}
.mt div.w{font-size:20px;font-weight:700}
.mt div.l::after{content:"●";font-size:18px;margin-left:auto}.mt div.rr::before{content:"●";font-size:18px;margin-right:auto}
.sil{filter:brightness(0)}
.shapes{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.shapes figure{margin:0;text-align:center;font-size:14px}
.tr{font-size:56px;font-weight:900;color:transparent;-webkit-text-stroke:2px #666;letter-spacing:8px;text-align:center;margin:4px 0;word-break:break-all}
.grd{display:inline-grid;gap:3px}.grd i{width:52px;height:52px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px}
.cmd{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}.cmd span{width:44px;height:44px;border:3px dashed #000;border-radius:8px}
.cn{text-align:center}
.pi{margin:auto}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.prog div{height:100%;background:var(--pr)}
.pl .tw{background:#fff;color:#000;border-radius:8px;padding:8px}
.pl h3{margin:4px 0;color:#000}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%;border:0!important;margin:0!important}}
</style></head><body>
<header><h1>Plano<span>Jardim</span> 🌈</h1><p class="sub">Fichas ilustradas automáticas + planejamento para Jardim I, II e III</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><span class="tag" style="background:rgba(255,255,255,.22);color:#fff">BNCC</span><span class="tag" style="background:rgba(255,255,255,.22);color:#fff">🤖 Robótica</span><span class="tag" style="background:rgba(255,255,255,.22);color:#fff">🛒 Empreendedorismo</span><span class="tag" style="background:rgba(255,255,255,.22);color:#fff">🇬🇧 English · 🇪🇸 Español</span></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const mem={};const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[r(0,a.length-1)],sh=a=>[...a].sort(()=>Math.random()-.5);
const F=['🍎','🍌','🍓','🍇','🍊','🍉'],A=['🐶','🐱','🐸','🐰','🐢','🐘','🐟','🦋'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const G=['Jardim I','Jardim II','Jardim III'];
let st={tab:ld('perfil',null)?'hoje':'onb',g:ld('g',1),sub:'Todas',q:'',cur:null,plan:null};

/* ---- geradores de fichas ---- */
const VOC=[['🍎','maçã','apple','manzana'],['🐶','cachorro','dog','perro'],['🐱','gato','cat','gato'],['🌞','sol','sun','sol'],['🏠','casa','house','casa'],['🐟','peixe','fish','pez'],['🚗','carro','car','coche'],['🌳','árvore','tree','árbol'],['⭐','estrela','star','estrella'],['🐦','pássaro','bird','pájaro'],['📖','livro','book','libro'],['🥛','leite','milk','leche']];
const INI=[['🍌','B'],['🐱','G'],['🏠','C'],['🐟','P'],['🍇','U'],['🌞','S'],['🐘','E'],['🦋','B'],['🍉','M'],['🌙','L'],['⚽','B'],['🐸','S']];
const COR=[['vermelho','#e53935'],['azul','#1e88e5'],['verde','#43a047'],['amarelo','#fdd835'],['laranja','#fb8c00'],['roxo','#8e24aa']];
const SHP=[s=>`<circle cx="45" cy="45" r="38" ${s}/>`,s=>`<rect x="8" y="8" width="74" height="74" rx="4" ${s}/>`,s=>`<polygon points="45,6 86,82 4,82" ${s}/>`,s=>`<polygon points="45,5 56,34 87,35 62,54 71,85 45,67 19,85 28,54 3,35 34,34" ${s}/>`,s=>`<path d="M45 82 C5 50 5 15 28 12 C38 11 45 20 45 25 C45 20 52 11 62 12 C85 15 85 50 45 82Z" ${s}/>`];
const NM=['círculo','quadrado','triângulo','estrela','coração'];
const match=(p,mode)=>{const R=sh(p);let h='<div class="mt">';p.forEach((x,i)=>{h+=`<div class="l">${x[0]}</div><div class="rr ${mode=='sil'?'':'w'}">${mode=='sil'?`<span class="sil">${R[i][0]}</span>`:R[i][1]}</div>`});return h+'</div>'};
const vm=(i)=>{const p=sh(VOC).slice(0,5);return match(p.map(x=>[x[0],x[i]]),'w')};
const CAT=[
{id:'somar',t:'Somar com figuras',s:'Matemática',i:'➕',k:'somar adicao soma juntar mais conta',f:g=>{const m=[5,10,10][g],e=()=>pick(F);let h='';for(let n=0;n<4;n++){const a=r(1,m-1),b=r(1,Math.min(m-a,g?6:3)),x=e();h+=`<div class="row"><span>${x.repeat(a)}</span><b>+</b><span>${x.repeat(b)}</span><b>=</b><span class="box"></span></div>`}return['Vamos somar!','Conte os desenhos e escreva o resultado no quadrinho.',h]}},
{id:'subtrair',t:'Subtrair: risque e conte',s:'Matemática',i:'➖',k:'subtrair subtracao tirar menos risque',f:g=>{const m=[5,8,10][g];let h='';for(let n=0;n<4;n++){const a=r(3,m),b=r(1,a-1),x=pick(A);h+=`<div class="row"><span>${x.repeat(a)}</span><b>−</b><span style="text-decoration:line-through;text-decoration-thickness:4px">${x.repeat(b)}</span><b>=</b><span class="box"></span></div>`}return['Vamos tirar!','Risque os desenhos que saem e escreva quantos sobraram.',h]}},
{id:'contar',t:'Contar e circular o número',s:'Matemática',i:'🔢',k:'contar quantidade numero numeral contagem circular',f:g=>{const m=[5,9,10][g];let h='';for(let n=0;n<4;n++){const q=r(1,m);let o=new Set([q]);while(o.size<3)o.add(r(1,m+1));h+=`<div class="row"><span>${pick(F).repeat(q)}</span></div><div class="cn">${sh([...o]).map(v=>`<span class="opt">${v}</span>`).join(' ')}</div>`}return['Quantos têm?','Conte e circule o número certo.',h]}},
{id:'sombra',t:'Ligar figura à sombra',s:'Matemática',i:'🔗',k:'ligar unir sombra figura ligue',f:g=>['Ligue à sombra','Una cada figura à sua sombra.',match(sh(A).slice(0,[4,5,6][g]).map(x=>[x,x]),'sil')]},
{id:'pintar',t:'Pintar formas e cores',s:'Artes',i:'🎨',k:'pintar colorir cores formas arte desenho',f:g=>{let h='<div class="shapes">';sh([0,1,2,3,4]).slice(0,4).forEach(n=>{const c=pick(COR);h+=`<figure><svg width="90" height="90" viewBox="0 0 90 90">${SHP[n]('fill="#fff" stroke="#000" stroke-width="4"')}</svg><div>Pinte de <b style="color:#000;border-bottom:4px solid ${c[1]}">${c[0]}</b></div></figure>`});return['Hora de colorir!','Pinte cada forma com a cor indicada.',h+'</div>']}},
{id:'tracejar',t:'Cobrir letras e números',s:'Linguagem',i:'✏️',k:'tracejar cobrir letras numeros vogais escrita pontilhado coordenacao motora',f:g=>{const L=[['A','E','I','O','U'],['1','2','3','4','5','6','7','8','9'],['B','C','D','F','G','L','M','P']][g];const p=sh(L).slice(0,4);return['Cubra e pinte','Passe o lápis por dentro e pinte as letras e números.',p.map(x=>`<div class="tr">${x.repeat(4)}</div>`).join('')]}},
{id:'inicial',t:'Letra inicial das figuras',s:'Linguagem',i:'🔤',k:'letra inicial alfabeto leitura palavras figura linguagem',f:g=>{let h='';sh(INI).slice(0,4).forEach(x=>{const o=new Set([x[1]]);while(o.size<3)o.add(String.fromCharCode(r(65,90)));h+=`<div class="row"><span>${x[0]}</span><span>${sh([...o]).map(v=>`<span class="opt">${v}</span>`).join(' ')}</span></div>`});return['Com qual letra começa?','Veja a figura e circule a letra inicial.',h]}},
{id:'robo',t:'Programar o robô na grade',s:'Robótica',i:'🤖',k:'robotica programacao robo codigo setas pensamento computacional algoritmo',f:g=>{const n=[3,4,5][g];let h='';for(let t=0;t<2;t++){let x=r(1,n-1),y=r(0,n-1);let c='';for(let j=0;j<n;j++)for(let i=0;i<n;i++)c+=`<i>${i==0&&j==0?'🤖':i==x&&j==y?'⭐':''}</i>`;h+=`<div class="cn"><div class="grd" style="grid-template-columns:repeat(${n},52px)">${c}</div><div class="cmd">${'<span></span>'.repeat(x+y)}</div></div>`}return['Programe o robô!','Desenhe as setas ⬆️ ⬇️ ➡️ nos quadrinhos para levar o robô 🤖 até a estrela ⭐. (Pode ser feito no chão com o corpo!)',h]}},
{id:'loja',t:'Lojinha: quanto custa?',s:'Empreendedorismo',i:'🛒',k:'empreendedorismo lojinha dinheiro moedas comprar vender preco valor mercado',f:g=>{let h='';[...F,'🍞','🧃'].slice(0,4+g).slice(0,4).forEach(x=>{const p=r(1,g?5:3);h+=`<div class="row"><span>${x}</span><span style="font-size:20px">custa R$ ${p}</span><span>${'🪙'.repeat(p+2)}</span></div>`});return['Minha lojinha','Risque só as moedas 🪙 que faltam para pagar. Quem sobra? Quem vende ganha o dinheiro!',h]}},
{id:'ingles',t:'English: ligue a palavra',s:'Inglês',i:'🇬🇧',k:'ingles english idioma vocabulario palavras',f:g=>['English time!','Match the picture to the word. Ligue a figura à palavra em inglês.',vm(2)]},
{id:'espanhol',t:'Español: une la palabra',s:'Espanhol',i:'🇪🇸',k:'espanhol espanol idioma vocabulario palabras',f:g=>['¡Hora de español!','Une el dibujo con la palabra. Ligue a figura à palavra em espanhol.',vm(3)]}
];
const SUBS=['Todas','Matemática','Linguagem','Artes','Natureza','Tempo','Emoções','Robótica','Empreendedorismo','Inglês','Espanhol'];
const SC={'Matemática':'#2f6bff','Linguagem':'#ff5d8f','Artes':'#ff9f1c','Robótica':'#7c4dff','Empreendedorismo':'#2bb673','Inglês':'#00a8cc','Espanhol':'#e8453c',Natureza:'#43a047',Tempo:'#5c6bc0','Emoções':'#ec407a'};
const AB=[['🐝','Abelha'],['⚽','Bola'],['🏠','Casa'],['🎲','Dado'],['🐘','Elefante'],['🌸','Flor'],['🐱','Gato'],['🦛','Hipopótamo'],['🏝️','Ilha'],['🐊','Jacaré'],['🥝','Kiwi'],['🌙','Lua'],['🍎','Maçã'],['🚢','Navio'],['🥚','Ovo'],['🐟','Peixe'],['🧀','Queijo'],['🐭','Rato'],['🌞','Sol'],['🐢','Tartaruga'],['🍇','Uva'],['🐮','Vaca'],['🧇','Waffle'],['☕','Xícara'],['🧘','Yoga'],['🦓','Zebra']];
const LT=n=>String.fromCharCode(65+n);
const VC={Animais:[['🐶','cachorro','dog','perro'],['🐱','gato','cat','gato'],['🐟','peixe','fish','pez'],['🐦','pássaro','bird','pájaro'],['🐮','vaca','cow','vaca'],['🐸','sapo','frog','rana'],['🐰','coelho','rabbit','conejo'],['🐢','tartaruga','turtle','tortuga']],Frutas:[['🍎','maçã','apple','manzana'],['🍌','banana','banana','plátano'],['🍇','uva','grape','uva'],['🍊','laranja','orange','naranja'],['🍓','morango','strawberry','fresa'],['🍉','melancia','watermelon','sandía']],Cores:[['🔴','vermelho','red','rojo'],['🔵','azul','blue','azul'],['🟢','verde','green','verde'],['🟡','amarelo','yellow','amarillo'],['🟠','laranja','orange','naranja'],['🟣','roxo','purple','morado']],Corpo:[['👀','olhos','eyes','ojos'],['👃','nariz','nose','nariz'],['👂','orelha','ear','oreja'],['👄','boca','mouth','boca'],['✋','mão','hand','mano'],['🦶','pé','foot','pie']],Família:[['👩','mamãe','mom','mamá'],['👨','papai','dad','papá'],['👧','irmã','sister','hermana'],['👦','irmão','brother','hermano'],['👵','vovó','grandma','abuela'],['👴','vovô','grandpa','abuelo']]};
CAT.push(
{id:'numero',t:'Números: cobrir e pintar',s:'Matemática',i:'🔢',k:'numeros numeral contar cobrir zero ate vinte',f:g=>{const [a,b]=[[1,5],[1,10],[0,20]][g];const p=sh(Array.from({length:b-a+1},(_,i)=>a+i)).slice(0,3);return['Meus números','Cubra o número e pinte as figuras na mesma quantidade.',p.map(n=>`<div class='row'><span class='tr' style='margin:0;font-size:64px;letter-spacing:4px'>${n}</span><span>${n?pick(F).repeat(n):'○'}</span></div>`).join('')]}},
{id:'sequencia',t:'Qual número falta?',s:'Matemática',i:'🔟',k:'sequencia numerica antes depois falta numeros ordem',f:g=>{let h='';for(let n=0;n<3;n++){const s=r(g==2?0:1,[1,4,12][g]),L=g?6:5,b=new Set([r(1,L-2)]);if(g)b.add(r(1,L-2));h+=`<div class='row'>${Array.from({length:L},(_,i)=>b.has(i)?`<span class='box'></span>`:`<b>${s+i}</b>`).join('')}</div>`}return['Qual número falta?','Escreva os números que faltam.',h]}},
{id:'qtdligar',t:'Ligar número à quantidade',s:'Matemática',i:'🔗',k:'ligar numero quantidade contar correspondencia',f:g=>{const m=[5,9,10][g];return['Número e quantidade','Ligue cada número ao grupo com a mesma quantidade.',match(sh(Array.from({length:m},(_,i)=>i+1)).slice(0,4).map(n=>[n,pick(F).repeat(n)]),'w')]}},
{id:'maior',t:'Maior e menor',s:'Matemática',i:'⚖️',k:'maior menor mais menos comparar quantidade',f:g=>{const m=[5,9,12][g],mais=Math.random()<.5;let h='';for(let n=0;n<4;n++){const a=r(1,m),b=r(1,m),e=pick(A);h+=`<div class='row'><span>${e.repeat(a)}</span><b>|</b><span>${e.repeat(a==b?b+1:b)}</span></div>`}return['Mais ou menos?',`Circule o grupo que tem ${mais?'MAIS':'MENOS'}.`,h]}},
{id:'classificar',t:'Classificar: animais e frutas',s:'Natureza',i:'🌿',k:'natureza classificar animais frutas separar ciencias seres vivos',f:g=>['Animais ou frutas?','Circule os animais e pinte as frutas.',`<div class='row'>${sh([...sh(A).slice(0,g+3),...sh(F).slice(0,g+3)]).map(x=>`<span>${x}</span>`).join('')}</div>`]},
{id:'semana',t:'Dias da semana',s:'Tempo',i:'📅',k:'tempo dias semana ontem hoje amanha calendario rotina',f:g=>{const D=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],b=new Set();while(b.size<g+2)b.add(r(0,6));if(g==0)return['Os dias da semana','Pinte o quadradinho dos dias em que vamos à escola. A professora lê os nomes.',D.map(d=>`<div class='row' style='font-size:22px;justify-content:flex-start'><span class='box'></span>${d}</div>`).join('')];return['Os dias da semana','Escreva os dias que faltam.',D.map((d,i)=>`<div class='row' style='font-size:22px;justify-content:flex-start'><b style='font-size:22px'>${i+1}º</b>${b.has(i)?`<span style='border-bottom:3px solid #000;min-width:180px'>&nbsp;</span>`:d}</div>`).join('')]}},
{id:'emocoes',t:'Ligar emoções',s:'Emoções',i:'😀',k:'emocoes sentimentos feliz triste bravo eu outro empatia',f:g=>['Como eu me sinto?','Ligue cada rosto ao sentimento.',match([['😀','feliz'],['😢','triste'],['😠','bravo'],['😲','surpreso'],['😴','sono'],['😨','medo']].slice(0,[3,4,5][g]),'w')]},
{id:'alfabeto',t:'Alfabeto: letra, figura e traçado',s:'Linguagem',i:'🔤',k:'alfabeto letras abecedario vogais consoantes escrita palavras tracado',f:g=>{const pool=g==0?[0,4,8,14,20]:Array.from({length:g==1?13:26},(_,i)=>i);return['Minhas letras','Cubra a letra, olhe a figura e pinte.',sh(pool).slice(0,3).map(n=>`<div class='row'><span class='tr' style='margin:0;font-size:64px;letter-spacing:4px'>${LT(n)}${LT(n).toLowerCase()}</span><span>${AB[n][0]}</span><span style='font-size:20px;font-weight:700'>${AB[n][1]}</span></div><div class='tr'>${(LT(n)+LT(n).toLowerCase()).repeat(3)}</div>`).join('')]}}

 const rows=PER[f.per].map((l,i)=>{const k=ks[i%ks.length],c=CP[k],a=c.a[Math.floor(i/ks.length+i)%c.a.length].replace('{t}',f.tema||'o tema da semana');
 return `<tr><td>${l}</td><td>${k}</td><td>${c.c?pre(f.g)+c.c+' — ':''}${c.o}</td><td>${big?'Projeto: ':''}${a}</td><td>${big?'Registro em portfólio/relatório':'Observação e registro no diário'}</td></tr>`}).join('');
 return `<h3>Plano ${f.per.toLowerCase()} · ${G[f.g]}</h3><p style="color:#000;margin:2px 0 8px;font-size:13px">Escola: ${esc(f.esc)||'________'} · Professor(a): ${esc(f.prof)||'________'} · Início: ${f.ini||'___/___/___'} · Tema: ${esc(f.tema)||'________'}</p><div class="tw"><table><tr><th>Período</th><th>Campo de experiência</th><th>Objetivo (BNCC)</th><th>Atividade</th><th>Avaliação</th></tr>${rows}</table></div><p style="color:#444;font-size:11px">Confira os códigos no documento oficial da BNCC. Eixos: interações e brincadeira.</p>`}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- telas ---- */
function nav(){$('#nav').innerHTML=[['hoje','🏠 Hoje'],['fichas','📄 Fichas'],['plano','🗓️ Planejar'],['prontos','📦 Planos prontos'],['curr','📚 Currículo'],['familia','💬 Família'],['coord','📊 Coordenação']].map(([k,l])=>`<button class="${st.tab==k?'on':''}" onclick="st.tab='${k}';draw()">${l}</button>`).join('')}
function gradeSel(){return `<div class="chips">${G.map((n,i)=>`<button class="chip ${st.g==i?'on':''}" onclick="st.g=${i};draw()">${n}</button>`).join('')}</div>`}
function fichas(){const q=norm(st.q);const L=CAT.filter(c=>(st.sub=='Todas'||c.s==st.sub)&&(!q||norm(c.t+' '+c.k+' '+c.s).includes(q)));
 let h=gradeSel()+`<input id="q" placeholder="Buscar: somar, pintar, ligar, robô, inglês…" value="${esc(st.q)}" oninput="st.q=this.value;fichas2()"><div class="chips">${SUBS.map(s=>`<button class="chip ${st.sub==s?'on':''}" style="border-color:${SC[s]||'var(--pr)'}" onclick="st.sub='${s}';st.cur=(CAT.find(c=>c.s=='${s}')||{}).id||null;st.go=1;draw()">${s}</button>`).join('')}</div><div id="res" class="grid"></div><div id="sheet"></div>`;$('#app').innerHTML=h;fichas2();if(st.cur)gen(st.go);st.go=0}
function fichas2(){const q=norm(st.q);const L=CAT.filter(c=>(c.min||0)<=st.g&&(st.sub=='Todas'||c.s==st.sub)&&(!q||norm(c.t+' '+c.k+' '+c.s).includes(q)));
 $('#res').innerHTML=L.map(c=>`<button class="item" style="border-top:5px solid ${SC[c.s]};background:linear-gradient(180deg,${SC[c.s]}22,var(--card) 65%)" onclick="st.cur='${c.id}';gen(true)"><span class="i">${c.i}</span><b>${c.t}</b><small>${c.s}</small></button>`).join('')||'<p class="sub">Nada encontrado. Tente “somar”, “pintar” ou “robô”.</p>';
 if(q&&L.length==1&&st.cur!=L[0].id){st.cur=L[0].id;gen()}}
function gen(sc){let c=CAT.find(x=>x.id==st.cur);if(c&&(c.min||0)>st.g){c=CAT.find(x=>x.s==c.s&&(x.min||0)<=st.g)||CAT.find(x=>!x.min);st.cur=c.id}if(!c)return;const [t,ins,body]=c.f(st.g);
 $('#sheet').innerHTML=`<div class="bar"><button class="btn pr" onclick="gen()">🔄 Gerar outra</button><button class="btn" onclick="window.print()">🖨️ Imprimir</button></div><div class="sheet printable" style="border-top:10px solid ${SC[c.s]}"><div class="hd"><span>Nome: ______________________</span><span>${G[st.g]}</span><span>Data: ___/___/___</span></div><h2>${t} <small style="font-size:14px;color:#555">· ${G[st.g]}</small></h2><p class="ins">${ins}</p>${body}</div>`;
 if(sc)$('#sheet').scrollIntoView({behavior:'smooth'})}
function plano(){const o=Object.keys(CP);const f=st.f||{};
 $('#app').innerHTML=`<div class="card">${gradeSel()}<label>Tipo de plano</label><select id="per">${Object.keys(PER).map(p=>`<option ${f.per==p?'selected':''}>${p}</option>`).join('')}</select><label>Tema / projeto</label><input id="tema" placeholder="Ex.: Os animais da fazenda" value="${esc(f.tema)}"><label>Escola</label><input id="esc" value="${esc(f.esc)}"><label>Professor(a)</label><input id="prof" value="${esc(f.prof)}"><label>Data de início</label><input id="ini" type="date" value="${f.ini||''}"><label>Campos e projetos inovadores</label><div class="chips">${o.map((k,i)=>`<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" style="width:auto" value="${k}" checked> ${k}</label>`).join('')}</div><div class="bar"><button class="btn pr" onclick="mk()">✨ Gerar plano</button></div></div><div id="out"></div>`}
function mk(){const f={g:st.g,per:$('#per').value,tema:$('#tema').value,esc:$('#esc').value,prof:$('#prof').value,ini:$('#ini').value,campos:[...document.querySelectorAll('.chips input:checked')].map(x=>x.value)};st.f=f;st.plan=f;
 $('#out').innerHTML=`<div class="bar"><button class="btn pr" onclick="savePlan()">💾 Salvar na coordenação</button><button class="btn" onclick="window.print()">🖨️ Imprimir</button></div><div class="card pl printable">${build(f)}</div>`;$('#out').scrollIntoView({behavior:'smooth'})}
function savePlan(){const p=ld('planos',[]);p.push({g:st.plan.g,per:st.plan.per,tema:st.plan.tema,prof:st.plan.prof,d:new Date().toLocaleDateString('pt-BR')});sv('planos',p);alert('Plano salvo! Veja na aba Coordenação.')}
function coord(){const p=ld('planos',[]);const pers=Object.keys(PER);const tot=G.length*pers.length;let ok=0;
 const rows=G.map((n,i)=>`<tr><td><b>${n}</b></td>${pers.map(x=>{const c=p.filter(a=>a.g==i&&a.per==x).length;if(c)ok++;return`<td style="text-align:center">${c?'✅ '+c:'—'}</td>`}).join('')}</tr>`).join('');
 const pct=Math.round(ok/tot*100);
 $('#app').innerHTML=`<div class="card"><b>Acompanhamento de planejamentos</b><p class="sub">Veja o que cada turma já entregou (planos salvos pelos professores).</p><div class="prog"><div style="width:${pct}%"></div></div><p class="sub">${pct}% dos planejamentos previstos · ${p.length} planos salvos</p><div class="tw" style="background:#fff;color:#000;border-radius:8px;padding:6px"><table><tr><th>Turma</th>${pers.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table></div></div>
 <div class="card"><b>Últimos planos</b>${p.slice(-6).reverse().map(a=>`<p style="margin:6px 0">${a.per} · ${G[a.g]} · ${esc(a.tema)||'sem tema'} <span class="tag">${esc(a.prof)||'professor'} · ${a.d}</span></p>`).join('')||'<p class="sub">Nenhum plano salvo ainda.</p>'}</div>
 <div class="card"><b>Observações da coordenação</b><textarea id="obs" rows="4" placeholder="Feedback, prazos, reuniões…" oninput="sv('obs',this.value)">${esc(ld('obs',''))}</textarea><div class="bar"><button class="btn" onclick="if(confirm('Limpar planos salvos?')){sv('planos',[]);coord()}">Limpar planos</button></div></div>`}
function draw(){nav();({fichas,plano,coord,curr,prontos,hoje,onb,familia})[st.tab]()}
draw();
</script></body></html>
